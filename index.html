<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A personal, interactive companion for Harvard's CS50P: lessons, a Python editor in the browser, auto-checked exercises and spaced review.">
<meta name="theme-color" content="#a51c30">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<script>try{var t=localStorage.getItem('c50-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<title>CS50P Companion</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/codemirror.css">
<link rel="stylesheet" href="css/editor.css">
</head>
<body>

<header class="top">
  <div class="top-in">
    <button class="btn sm menu-btn" id="menuBtn" aria-controls="side" aria-expanded="false">Menu</button>
    <div class="brand"><span class="mark">CS50P</span><b>Companion</b></div>
    <div class="timer" id="timer" aria-label="Focus timer"></div>
    <a class="btn sm" href="#" id="contBtn" title="Continue where you left off">Continue</a>
    <a class="btn sm revlink" href="#review" title="Daily review">Review<span class="rb" id="revBadge" hidden>0</span></a>
    <button class="btn sm" id="themeBtn" aria-label="Toggle dark mode" title="Light / dark">Theme</button>
    <div class="prog" aria-label="Your progress">
      <div class="prog-bar"><i id="progBar"></i></div>
      <span class="prog-txt" id="progTxt"></span>
    </div>
  </div>
</header>

<div class="shell">
<aside class="side" id="side"><nav id="nav" aria-label="Weeks and lessons"></nav>
  <div class="tools"><span class="engine" id="engineStatus">Python engine: loading…</span><span class="engine" id="editorStatus">Code editor: loading…</span><span class="engine" id="syncStatus">Progress is saved in this browser. Use Export to back it up or move it to another device.</span><button class="btn sm" id="expProg">Export progress</button><button class="btn sm" id="impProg">Import progress</button><input type="file" id="impFile" accept="application/json" hidden><button class="btn sm" id="resetProg">Reset my progress</button></div>
</aside>
<main id="main"><p class="lede" id="loading">Loading your lessons…</p></main>
</div>
<noscript><p style="padding:24px">This site needs JavaScript to run Python in your browser.</p></noscript>

<script src="js/loader.js"></script>
</body>
</html>
