<article class="lesson" data-id="w7-patterns" data-week="7" data-title="Regex patterns"><h1>Regex syntax</h1><p><code>\d</code> matches a digit, <code>\w</code> a word character, and <code>.</code> any character except newline by default. Quantifiers <code>+</code>, <code>*</code>, <code>?</code> and <code>{3}</code> control repetition. Use raw strings such as <code>r"\d+"</code> to keep backslashes readable.</p><p>Reference: <a href="https://docs.python.org/3/library/re.html">re module</a></p><div class="widget runner" data-runner="w7_search"></div><div class="widget quiz" data-quiz="w7patterns"></div></article>
