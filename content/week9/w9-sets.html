<article class="lesson" data-id="w9-sets" data-week="9" data-title="Sets and hashability"><h1>Sets and hashability</h1><p>Sets contain unique hashable elements and support union, intersection and difference. Use them for membership and deduplication, not when order or duplicates matter. Lists are mutable and therefore cannot be set elements.</p><p>Reference: <a href="https://docs.python.org/3/library/stdtypes.html#set-types-set-frozenset">Set types</a></p><div class="widget runner" data-runner="w9_sets"></div><div class="widget quiz" data-quiz="w9sets"></div></article>
