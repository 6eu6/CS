<article class="lesson" data-id="w4-import" data-week="4" data-title="Modules and imports"><h1>Modules and imports</h1><p>A module groups reusable names. Use <code>import math</code> then call <code>math.ceil(4.2)</code>. Explicit imports make origins clear. Python searches <code>sys.path</code>; avoid naming your files after standard modules.</p><p>Standard library reference: <a href="https://docs.python.org/3/tutorial/modules.html">Modules</a></p><div class="widget runner" data-runner="w4_math"></div><div class="widget quiz" data-quiz="w4import"></div></article>
