<article class="lesson" data-id="w8-classes" data-week="8" data-title="Classes and instances"><h1>Classes and instances</h1><p>A class defines a type; an instance is an object created from it. <code>__init__</code> initialises instance state. <code>self</code> refers to the current instance and is passed automatically when calling an instance method. Keep each object's state valid from creation.</p><p>Reference: <a href="https://docs.python.org/3/tutorial/classes.html">Classes</a></p><div class="widget runner" data-runner="w8_class"></div><div class="widget quiz" data-quiz="w8classes"></div></article>
