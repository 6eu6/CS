<article class="lesson" data-id="w8-inheritance" data-week="8" data-title="Inheritance and composition"><h1>Inheritance and composition</h1><p>Inheritance models an is-a relationship and allows specialisation. <code>super()</code> delegates to the next class in the method resolution order. Prefer composition when one object merely uses another. Avoid deep hierarchies without a real shared contract.</p><p>Reference: <a href="https://docs.python.org/3/library/functions.html#super">super()</a></p><div class="widget runner" data-runner="w8_inherit"></div><div class="widget quiz" data-quiz="w8inherit"></div></article>
