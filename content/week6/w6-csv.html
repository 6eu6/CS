<article class="lesson" data-id="w6-csv" data-week="6" data-title="CSV files"><h1>CSV and structured data</h1><p>Use <code>csv.reader</code> for positional rows and <code>csv.DictReader</code> for named columns. Open CSV files with <code>newline=""</code>. Convert strings to domain types and validate them. CSV has quoting rules: never parse it with <code>split(",")</code>.</p><p>Reference: <a href="https://docs.python.org/3/library/csv.html">csv module</a></p><div class="widget runner" data-runner="w6_csv"></div><div class="widget quiz" data-quiz="w6csv"></div></article>
